[project]
name = "ybrec"
version = "0.1.0"
description = "Unofficial CLI to fetch your own Tencent Yuanbao (元宝) AI-recorder recordings, transcripts and summaries — for personal AI-agent workflows."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Neo", email = "neohuiqixue@foxmail.com" }]
dependencies = ["websocket-client>=1.6"]

[project.scripts]
ybrec = "ybrec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ybrec"]
